services:
  mysql:
    image: mysql:9
    container_name: patota-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: patota
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    profiles: [api]
    image: maven:3.9-eclipse-temurin-25
    working_dir: /workspace
    command: mvn spring-boot:run -q
    environment:
      DB_URL: jdbc:mysql://mysql:3306/patota
      DB_USERNAME: root
      DB_PASSWORD: root
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - .:/workspace
      - maven-cache:/root/.m2
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  maven-cache:
